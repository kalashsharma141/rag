<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 Days of Summer Q&A</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
        margin: 0;
        padding: 2rem;
      }
      .card {
        max-width: 760px;
        margin: auto;
        background: white;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      }
      textarea {
        width: 100%;
        min-height: 90px;
        padding: 0.8rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        margin-top: 0.7rem;
        font-size: 1rem;
      }
      button {
        margin-top: 0.8rem;
        padding: 0.75rem 1rem;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .answer {
        margin-top: 1rem;
        padding: 1rem;
        background: #f9fafb;
        border-radius: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>500 Days of Summer Q&amp;A</h2>
      <p>Type a question about the movie and the assistant will respond.</p>
      <textarea id="query" placeholder="Example: Who is the main character in the movie?" onkeydown="if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); askQuestion(); }"></textarea>
      <button onclick="askQuestion()">Ask</button>
      <div id="answer" class="answer">Waiting for your question...</div>
    </div>

    <script>
      async function askQuestion() {
        const query = document.getElementById('query').value.trim();
        const answerBox = document.getElementById('answer');
        if (!query) {
          answerBox.textContent = 'Please enter a question.';
          return;
        }
        answerBox.textContent = 'Thinking...';
        try {
          const response = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query })
          });
          const data = await response.json();
          answerBox.textContent = data.answer || 'No answer returned.';
        } catch (err) {
          answerBox.textContent = 'Error: ' + err.message;
        }
      }
    </script>
  </body>
</html>
